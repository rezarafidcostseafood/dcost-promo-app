# Contoh blueprint untuk Render.com (BELUM DIUJI; cek dokumentasi Render terbaru). Wajib ada disk agar data tidak hilang saat restart.
services:
  - type: web
    name: analisa-promo-dcost
    runtime: docker
    plan: starter
    disk:
      name: data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /data
      - key: COOKIE_SECURE
        value: "1"
